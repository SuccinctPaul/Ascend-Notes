site_name: Ascend NPU 知识库
site_description: 面向 0→1 新手的 NPU 知识库，以昇腾 Ascend NPU 为核心，涵盖硬件架构、LLM 算子、性能优化与 Profiling
site_url: ""  # TODO: 部署到 GitHub Pages 后填入你的站点地址，例如 https://<your-username>.github.io/Ascend-Notes/

theme:
  name: material
  language: zh
  icon:
    logo: material/robot
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/lightbulb-outline
        name: 切换到浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: zh
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Ascend NPU Knowledge Base

nav:
  - 首页: index.md
  - 构建与部署说明: DEPLOYMENT.md
  - 术语表: reference/context.md
  - 一、NPU 体系化架构:
      - 01 · AI Core 硬件模型全貌: hardware/01-ai-core-overview.md
      - 02 · 存储层级与访问权域: hardware/02-storage-hierarchy.md
      - 03 · host/device 与 kernel 生命周期: hardware/03-host-device-kernel-lifecycle.md
      - 04 · 昇腾 vs NVIDIA(Hopper) vs Intel Gaudi: hardware/04-npu-architecture-comparison.md
  - 二、LLM 优化算子:
      - 01 · element-wise 与算子融合: ops/01-elementwise-and-fusion.md
      - 02 · RMSNorm: ops/02-rmsnorm.md
      - 03 · Softmax: ops/03-softmax.md
      - 04 · RoPE 旋转位置编码: ops/04-rope.md
      - 05 · GELU 与激活: ops/05-gelu.md
      - 06 · GQA 与 KV Cache: ops/06-gqa-kvcache.md
      - 07 · FlashAttention: ops/07-flash-attention.md
      - 08 · 量化与反量化: ops/08-quantization.md
      - 09 · GEMM（四种 DSL 实证）: ops/09-gemm.md
  - 三、性能优化与 Profiling:
      - 01 · 性能模型与 Roofline: perf/01-roofline-perf-model.md
      - 02 · Tiling 与流水线重叠: perf/02-tiling-pipeline-overlap.md
      - 03 · Profiling 工具与读法: perf/03-profiling-tools.md
      - 04 · 瓶颈识别与优化手段: perf/04-bottleneck-and-optimization.md
      - 05 · 四种 DSL 实测解读: perf/05-dsl-benchmark-analysis.md

extra:
  generator: false